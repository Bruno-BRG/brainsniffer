[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "brainsniffer"
version = "0.1.0"
description = "Research prototype for EEG-based anesthesia-depth estimation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "BrainSniffer research project" }]
dependencies = [
  "h5py>=3.10",
  "numpy>=2.1",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.10",
  "pytest>=8.3",
  "python-docx>=1.2",  # docs/submissao-jhi/: build dos DOCX da submissão
  "ruff>=0.6",
]

[project.scripts]
brainsniffer = "brainsniffer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brainsniffer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
