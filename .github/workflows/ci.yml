name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.12 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Verify lock file
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Lint with Ruff
        run: uv run --locked --extra dev ruff check .

      - name: Run tests
        run: uv run --locked --extra dev pytest -q

      - name: Compile and smoke-test imports
        run: |
          uv run --locked --extra dev python -m compileall -q src tests dash_app.py
          uv run --locked --extra dev python - <<'PY'
          import sys

          import brainsniffer
          import brainsniffer.cli
          from dash_app import server

          assert sys.version_info[:2] == (3, 12), sys.version
          assert server is not None
          PY
